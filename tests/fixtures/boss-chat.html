<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<style>.message-list { min-height: 1rem; } .message-text { white-space: pre-wrap; }</style>
<nav class="user-nav"><div class="nav-figure"><a ka="header-username" href="/web/geek/recommend">已登录求职者</a></div></nav>
<section class="chat-container">
  <div class="chat-header">
    <span class="boss-name">{{RECRUITER}}</span>
    <span class="company-name">示例科技</span>
    <a href="/job_detail/right-city.html">AI 应用工程师</a>
  </div>
  <div class="message-list">{{MESSAGES}}</div>
  <div class="chat-editor">
    <textarea aria-label="消息"></textarea>
    <button type="button" onclick="sendText()">发送</button>
    {{EXTRA_SEND}}
    <button type="button" onclick="document.querySelector('.resume-dialog').hidden = false">选择附件简历</button>
  </div>
  <div class="resume-dialog" role="dialog" aria-label="选择附件简历" hidden>
    <label><input type="radio" name="resume" value="设计师.pdf">设计师.pdf</label>
    <label><input type="radio" name="resume" value="AI工程师.pdf">AI工程师.pdf</label>
    <button type="button" onclick="sendResume()">发送附件</button>
  </div>
</section>
<script>
  function addOutgoing(kind, value) {
    const row = document.createElement('div');
    row.className = 'message-item message-self';
    const content = document.createElement('span');
    content.className = kind === 'resume' ? 'attachment-name' : 'message-text';
    content.textContent = value;
    row.appendChild(content);
    document.querySelector('.message-list').appendChild(row);
  }
  const preset = sessionStorage.getItem('pendingPreset');
  if (preset) {
    sessionStorage.removeItem('pendingPreset');
    setTimeout(() => {
      addOutgoing('text', preset);
      const receipt = document.createElement('div');
      receipt.setAttribute('role', 'status');
      receipt.textContent = '招呼已发送';
      document.querySelector('.chat-container').appendChild(receipt);
    }, 400);
  }
  function record(kind, value) {
    sessionStorage.setItem('attempts', (sessionStorage.getItem('attempts') || '') + kind + ':' + value + '\n');
    if (!location.search.includes('noAck')) {
      addOutgoing(kind, value);
    }
  }
  function sendText() {
    record('text', document.querySelector('textarea').value);
    document.querySelector('textarea').value = '';
  }
  function sendResume() {
    record('resume', document.querySelector('input[name="resume"]:checked').value);
    document.querySelector('.resume-dialog').hidden = true;
  }
</script>
</html>
